name: Synchronize public Hacker Club projects
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: hacker-club-public-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Export verified public resources
        env:
          PROJECT_BOARD_TOKEN: ${{ secrets.PROJECT_BOARD_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/export-projects.mjs
      - name: Commit changed snapshot
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- assets/data/hacker-club-projects.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/data/hacker-club-projects.json
          git commit -m 'Update public Hacker Club project snapshot'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Request legacy Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
