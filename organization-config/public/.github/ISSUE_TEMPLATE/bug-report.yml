name: Bug report
description: Report a reproducible problem in this repository. Report vulnerabilities privately.
body:
  - type: markdown
    attributes:
      value: "Please remove personal data and credentials. For a vulnerability, follow SECURITY.md instead of submitting this public form."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the relevant version, environment and minimal reproduction.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Redacted logs or screenshots may help.
